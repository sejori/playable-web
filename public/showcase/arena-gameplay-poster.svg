<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="55%" stop-color="#1a1528" />
      <stop offset="100%" stop-color="#2a1215" />
    </linearGradient>
    <radialGradient id="lavaGlow" cx="50%" cy="62%" r="42%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lanceBeam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background & Lava Atmosphere -->
  <rect width="960" height="540" fill="url(#skyGrad)" />
  <rect width="960" height="540" fill="url(#lavaGlow)" />

  <!-- Perspective 3D Rig Platform Deck -->
  <polygon points="160,430 800,430 920,540 40,540" fill="#111827" stroke="#334155" stroke-width="2" />
  <polygon points="240,290 720,290 830,430 130,430" fill="#161f33" stroke="#475569" stroke-width="2" />

  <!-- Perspective Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.65">
    <line x1="320" y1="290" x2="250" y2="430" />
    <line x1="400" y1="290" x2="365" y2="430" />
    <line x1="480" y1="290" x2="480" y2="430" />
    <line x1="560" y1="290" x2="595" y2="430" />
    <line x1="640" y1="290" x2="710" y2="430" />
    <line x1="205" y1="335" x2="755" y2="335" />
    <line x1="170" y1="380" x2="790" y2="380" />
  </g>

  <!-- Volcanic Shockwave Hazard Ring -->
  <ellipse cx="560" cy="345" rx="145" ry="52" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="10 6">
    <animate attributeName="rx" values="135;155;135" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.9;0.35;0.9" dur="3s" repeatCount="indefinite" />
  </ellipse>

  <!-- CoalVent_01 Node (Layer 4: metal_source) -->
  <g transform="translate(275, 345)">
    <ellipse cx="0" cy="18" rx="34" ry="13" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <path d="M-20,16 L-12,-18 L12,-18 L20,16 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="-24" r="7" fill="#38bdf8">
      <animate attributeName="cy" values="-22;-42;-22" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.95;0.2;0.95" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="38" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">
      CoalVent_01 [Metal Ore]
    </text>
  </g>

  <!-- PlayerCharacter (Layer 2) with Orbiting Metal Shield -->
  <g transform="translate(375, 375)">
    <ellipse cx="0" cy="24" rx="28" ry="10" fill="#090d16" opacity="0.7" />
    <ellipse cx="0" cy="4" rx="36" ry="15" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="14 8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 4" to="360 0 4" dur="4s" repeatCount="indefinite" />
    </ellipse>
    <rect x="-12" y="-26" width="24" height="46" rx="8" fill="#38bdf8" stroke="#e0f2fe" stroke-width="2" />
    <text x="0" y="42" fill="#f8fafc" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">
      PlayerCharacter (Shield Active)
    </text>
  </g>

  <!-- Tectonic Earth Lance Projectile -->
  <g>
    <line x1="395" y1="360" x2="535" y2="325" stroke="url(#lanceBeam)" stroke-width="5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite" />
    </line>
    <polygon points="545,322 522,318 528,334" fill="#38bdf8" />
  </g>

  <!-- Fire Warden Boss (Layer 3) -->
  <g transform="translate(565, 315)">
    <ellipse cx="0" cy="36" rx="44" ry="16" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <path d="M-28,32 L-22,-42 L0,-56 L22,-42 L28,32 Z" fill="#dc2626" stroke="#fca5a5" stroke-width="2" />
    <circle cx="-9" cy="-28" r="4" fill="#fef08a" />
    <circle cx="9" cy="-28" r="4" fill="#fef08a" />
    <rect x="-65" y="-82" width="130" height="10" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect x="-63" y="-80" width="98" height="6" rx="3" fill="#ef4444" />
    <text x="0" y="-90" fill="#fca5a5" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">
      Fire Warden Boss (1,830 / 2,200 HP)
    </text>
  </g>

  <!-- Top-Left Native Engine Recording Overlay -->
  <rect x="20" y="18" width="445" height="58" rx="8" fill="#090d16" fill-opacity="0.84" stroke="#283548" stroke-width="1.5" />
  <circle cx="40" cy="38" r="6" fill="#10b981">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <text x="55" y="42" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">
    GODOT 4.7.2 NATIVE VULKAN CAPTURE • JOLT PHYSICS 60HZ
  </text>
  <text x="55" y="62" fill="#94a3b8" font-family="monospace" font-size="11">
    Scene: res://scenes/zones/fire_prison_rig.tscn • Native C++ GDExtensions
  </text>

  <!-- Top-Right Frame Budget Telemetry Pill -->
  <rect x="705" y="18" width="235" height="58" rx="8" fill="#090d16" fill-opacity="0.84" stroke="#283548" stroke-width="1.5" />
  <text x="722" y="41" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">
    120.0 FPS (8.3ms) • 112 Draw Calls
  </text>
  <text x="722" y="61" fill="#38bdf8" font-family="monospace" font-size="11">
    Netfox 30Hz • #TEST-4821
  </text>
</svg>
