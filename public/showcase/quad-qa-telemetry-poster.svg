  <line x1="0" y1="270" x2="960" y2="270" stroke="#38bdf8" stroke-width="2" />

  <!-- Q1: Top-Left — 3rd-Person Vulkan Camera -->
  <g transform="translate(0, 0)">
    <rect x="8" y="8" width="464" height="254" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="22" y="30" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">
      [Q1] 3RD-PERSON VULKAN VIEWPORT (PhantomCamera3D)
    </text>
    <polygon points="80,220 400,220 435,250 45,250" fill="#1e293b" stroke="#475569" />
    <circle cx="185" cy="185" r="16" fill="#38bdf8" />
    <circle cx="315" cy="165" r="24" fill="#ef4444" />
    <line x1="201" y1="181" x2="291" y2="169" stroke="#f97316" stroke-width="3" stroke-dasharray="6 4" />
