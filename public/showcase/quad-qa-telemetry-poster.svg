  <g transform="translate(480, 270)">
    <rect x="8" y="8" width="464" height="254" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="22" y="30" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold">
