    <circle cx="120" cy="185" r="6" fill="#10b981" />
    <circle cx="195" cy="140" r="6" fill="#10b981" />
    <circle cx="345" cy="110" r="8" fill="#f59e0b" />
    <text x="22" y="244" fill="#a7f3d0" font-family="monospace" font-size="11">
      1,800 Ticks Verified • Nav Stuck: 0 • Path Cost: 14.2m
    </text>
  </g>

  <!-- Q3: Bottom-Left — JoltPhysics3D Collision Wireframe -->
  <g transform="translate(0, 270)">
    <rect x="8" y="8" width="464" height="254" rx="6" fill="#0b111e" stroke="#1e293b" />
