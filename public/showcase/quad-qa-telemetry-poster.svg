    <rect x="145" y="125" width="30" height="50" fill="none" stroke="#22d3ee" stroke-width="2" />
    <circle cx="315" cy="145" r="55" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="8 4" />
    <rect x="290" y="110" width="50" height="70" fill="none" stroke="#ef4444" stroke-width="2" />
    <text x="22" y="244" fill="#fdba74" font-family="monospace" font-size="11">
