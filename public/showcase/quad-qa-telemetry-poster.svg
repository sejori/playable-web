    <rect x="32" y="52" width="416" height="160" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4" />
    <text x="48" y="82" fill="#e2e8f0" font-family="monospace" font-size="12">✓ AST Security Gate: 16/16 scripts clean (--sandboxed-pck)</text>
    <text x="48" y="108" fill="#e2e8f0" font-family="monospace" font-size="12">✓ Interface Contract: fire_prison_rig.tscn (7/7 nodes)</text>
    <text x="48" y="134" fill="#e2e8f0" font-family="monospace" font-size="12">✓ Draw Call Budget: 112 / 180 max (PASS)</text>
    <text x="48" y="160" fill="#e2e8f0" font-family="monospace" font-size="12">✓ VRAM Allocation: 412 MB / 1,024 MB budget</text>
